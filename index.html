<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git Test Page</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f0f4f8;
    }
    .card {
      background: white;
      border-radius: 8px;
      padding: 2rem 3rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 { color: #2d3748; margin-bottom: 0.5rem; }
    p { color: #718096; }
    .badge {
      display: inline-block;
      background: #48bb78;
      color: white;
      border-radius: 4px;
      padding: 0.25rem 0.75rem;
      font-size: 0.875rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Git Test Page</h1>
    <p>This page was created to test git commit and push.</p>
    <div class="badge">It works!</div>
  </div>
</body>
</html>
