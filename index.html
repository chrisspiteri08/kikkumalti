<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kikkumalti - Mużika għat-Tfal!</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LRBWYZP03E"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-LRBWYZP03E');
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --ink: #f4f7ff;
      --muted: #aeb9d1;
      --accent: #f05bad;
      --accent-dark: #ff9bd3;
      --accent-soft: #382546;
      --surface: #172544;
      --page: #0b1630;
      --line: #2b3a5c;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--page);
      color: var(--ink);
      overflow-x: hidden;
    }

    /* ── Header ── */
    header {
      background: #101d38;
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      display: block;
      width: 180px;
      overflow: hidden;
      border-radius: 10px;
      text-decoration: none;
    }
    .logo img {
      display: block;
      width: 100%;
      height: auto;
    }
    nav a {
      color: var(--ink);
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      margin-left: 1.5rem;
      transition: color 0.2s;
      display: inline-block;
    }
    nav a:hover { color: var(--accent-dark); }

    @media (max-width: 640px) {
      header { padding: 0.75rem; }
      .logo { width: 140px; }
      nav a { margin-left: 0.55rem; font-size: 0.8rem; }
    }

    /* ── Hero ── */
    .hero {
      text-align: center;
      padding: 4rem 2rem 3rem;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffcece' fill-opacity='0.3'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");
    }
    .hero-emoji {
      font-size: 5rem;
      animation: bounce 1.6s infinite;
      display: block;
      margin-bottom: 1rem;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-16px); }
    }
    .hero h1 {
      font-size: 3rem;
      font-weight: 900;
      color: #e63946;
      line-height: 1.2;
      margin-bottom: 1rem;
    }
    .hero p {
      font-size: 1.25rem;
      color: #555;
      max-width: 500px;
      margin: 0 auto 2rem;
    }
    .btn {
      display: inline-block;
      background: #ff6b6b;
      color: white;
      font-family: 'Nunito', sans-serif;
      font-size: 1.15rem;
      font-weight: 900;
      padding: 0.85rem 2.5rem;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 6px 0 #c0392b;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn:hover { transform: translateY(3px); box-shadow: 0 3px 0 #c0392b; }

    /* ── Section headings ── */
    .section-title {
      text-align: center;
      font-size: 2rem;
      font-weight: 900;
      color: var(--ink);
      margin-bottom: 2.25rem;
    }
    .section-title::after {
      content: '';
      display: block;
      width: 52px;
      height: 4px;
      margin: 0.6rem auto 0;
      background: var(--accent);
      border-radius: 999px;
    }

    /* ── Videos section ── */
    .videos-section {
      padding: 4rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .video-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(41,40,58,0.05);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .video-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(41,40,58,0.1);
    }

    /* Thumbnail wrapper — 16:9 */
    .thumb-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #111;
      overflow: hidden;
    }
    .thumb-wrap img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .video-card:hover .thumb-wrap img { transform: scale(1.04); }

    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.15);
      transition: background 0.2s;
    }
    .video-card:hover .play-overlay { background: rgba(0,0,0,0.3); }
    .play-circle {
      width: 56px; height: 56px;
      background: var(--accent);
      color: white;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 4px 16px rgba(183,42,122,0.3);
      transition: transform 0.2s;
    }
    .video-card:hover .play-circle { transform: scale(1.1); }

    .video-info {
      padding: 0.9rem 1rem 1rem;
    }
    .video-info h3 {
      font-size: 0.95rem;
      font-weight: 900;
      color: var(--ink);
      line-height: 1.3;
    }
    .video-info .tag {
      display: inline-block;
      margin-top: 0.4rem;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.15rem 0.6rem;
      border-radius: 20px;
      color: var(--accent-dark);
      background: var(--accent-soft);
    }

    /* ── Shorts section ── */
    .shorts-section {
      background: #101d38;
      padding: 4rem 2rem;
    }
    .shorts-inner {
      max-width: 1000px;
      margin: 0 auto;
    }

    .shorts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.25rem;
    }

    .short-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(41,40,58,0.05);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .short-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(41,40,58,0.1);
    }

    /* 9:16 portrait */
    .short-thumb {
      position: relative;
      width: 100%;
      padding-top: 177.78%;
      background: #111;
      overflow: hidden;
    }
    .short-thumb img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .short-card:hover .short-thumb img { transform: scale(1.04); }
    .short-thumb .play-overlay { background: rgba(0,0,0,0.2); }
    .short-card:hover .short-thumb .play-overlay { background: rgba(0,0,0,0.35); }

    .short-info {
      padding: 0.75rem 0.9rem 0.9rem;
    }
    .short-info h3 {
      font-size: 0.88rem;
      font-weight: 900;
      color: var(--ink);
      line-height: 1.3;
    }
    .shorts-badge {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent-dark);
      font-size: 0.7rem;
      font-weight: 900;
      padding: 0.1rem 0.5rem;
      border-radius: 20px;
      margin-top: 0.35rem;
    }

    /* ── Footer ── */
    footer {
      background: #071126;
      color: #d8d7df;
      text-align: center;
      padding: 1.5rem;
      font-size: 0.9rem;
    }
    footer span { color: var(--accent); }
    footer a { color: #f3a9d4; text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* ── Modal ── */
    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-bg.open { display: flex; }
    .modal-box {
      position: relative;
      width: 100%;
      max-width: 860px;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
    }
    .modal-box.short-modal { max-width: 400px; }
    .modal-ratio { position: relative; width: 100%; padding-top: 56.25%; }
    .modal-box.short-modal .modal-ratio { padding-top: 177.78%; }
    .modal-ratio iframe {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      border: none;
    }
    .modal-close {
      position: absolute;
      top: -2.5rem;
      right: 0;
      background: none;
      border: none;
      color: white;
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
    }

    @media (max-width: 640px) {
      .videos-section, .shorts-section { padding: 3rem 1rem; }
      .video-grid { grid-template-columns: 1fr; }
      .shorts-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="#" aria-label="Kikku home">
      <img src="assets/kikku-logo.png" alt="Kikku">
    </a>
    <nav>
      <a href="#videos">Vidjows</a>
      <a href="#shorts">Shorts</a>
      <a href="https://www.youtube.com/@KikkuMalti" target="_blank">YouTube</a>
    </nav>
  </header>

  <!-- ── Full Videos ── -->
  <section class="videos-section" id="videos">
    <h2 class="section-title">🎬 Id-Diski Tiegħi</h2>
    <div class="video-grid" id="videoGrid"></div>
  </section>

  <!-- ── Shorts ── -->
  <section class="shorts-section" id="shorts">
    <div class="shorts-inner">
      <h2 class="section-title">⚡ Shorts</h2>
      <div class="shorts-grid" id="shortsGrid"></div>
    </div>
  </section>

  <footer>
    <p>Magħmul b'<span>♥</span> għat-tfal li jħobbu l-mużika &nbsp;·&nbsp;
      <a href="https://www.youtube.com/@KikkuMalti" target="_blank">Abbona fuq YouTube</a>
      &nbsp;·&nbsp; Kikkumalti &copy; 2026
    </p>
  </footer>

  <!-- ── Modal player ── -->
  <div class="modal-bg" id="modalBg">
    <div class="modal-box" id="modalBox">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-ratio">
        <iframe id="modalFrame" allowfullscreen
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
        </iframe>
      </div>
    </div>
  </div>

  <script>
    const VIDEOS = [
      { id: 'ZtlPid3VbGU' },
      { id: 'o2M5pITcMhs' },
      { id: 'HFJP__4gaPQ' },
      { id: 'dRjuuaMASJU' },
      { id: 'I3iTBRqU77c' },
    ];

    const SHORTS = [
      { id: 'F3HvaOjcAwI' },
      { id: 'x5jnFfWUzcI' },
      { id: 'F94L3NmSD3M' },
    ];

    function thumb(id) {
      return `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
    }

    function playOverlay() {
      return `<div class="play-overlay"><div class="play-circle">▶</div></div>`;
    }

    // Fetch title via oEmbed (runs in browser, no CORS issue)
    async function fetchTitle(id, el) {
      try {
        const r = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`);
        const d = await r.json();
        el.textContent = d.title;
      } catch(_) {}
    }

    // Build video grid
    const vGrid = document.getElementById('videoGrid');
    VIDEOS.forEach(v => {
      const card = document.createElement('div');
      card.className = 'video-card';
      card.innerHTML = `
        <div class="thumb-wrap">
          <img src="${thumb(v.id)}" alt="video thumbnail" loading="lazy">
          ${playOverlay()}
        </div>
        <div class="video-info">
          <h3 class="vtitle">Qed jillowdja…</h3>
          <span class="tag">🎵 Kanzunetta</span>
        </div>`;
      card.addEventListener('click', () => openModal(v.id, false));
      vGrid.appendChild(card);
      fetchTitle(v.id, card.querySelector('.vtitle'));
    });

    // Build shorts grid
    const sGrid = document.getElementById('shortsGrid');
    SHORTS.forEach((v, i) => {
      const card = document.createElement('div');
      card.className = 'short-card';
      card.innerHTML = `
        <div class="short-thumb">
          <img src="${thumb(v.id)}" alt="short thumbnail" loading="lazy">
          ${playOverlay()}
        </div>
        <div class="short-info">
          <h3 class="vtitle">Qed jillowdja…</h3>
          <span class="shorts-badge">Shorts</span>
        </div>`;
      card.addEventListener('click', () => openModal(v.id, true));
      sGrid.appendChild(card);
      fetchTitle(v.id, card.querySelector('.vtitle'));
    });

    // Modal
    const modalBg    = document.getElementById('modalBg');
    const modalBox   = document.getElementById('modalBox');
    const modalFrame = document.getElementById('modalFrame');
    const modalClose = document.getElementById('modalClose');

    function openModal(id, isShort) {
      modalFrame.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
      modalBox.classList.toggle('short-modal', isShort);
      modalBg.classList.add('open');
    }

    function closeModal() {
      modalBg.classList.remove('open');
      modalFrame.src = '';
    }

    modalClose.addEventListener('click', closeModal);
    modalBg.addEventListener('click', e => { if (e.target === modalBg) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  </script>

</body>
</html>
